services:
  - type: web
    name: slow-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DEFAULT_DELAY_MS
        value: "140000"
      - key: MAX_DELAY_MS
        value: "300000"
      - key: DRIP_CHUNKS
        value: "14"
